name: PR Title Spell Check

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typos:
    name: Spell check PR title
    # Keep public-fork code off the shared ARC fleet; reserve the merge pool
    # for merge-group and main-push jobs, and use the regular pool for PRs.
    runs-on: >-
      ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          'ubuntu-latest' ||
          (github.event_name == 'merge_group' || github.event_name == 'push') &&
          'hyperswitch-runners-merge' || 'hyperswitch-runners' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Store PR title in a file
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo $TITLE > pr_title.txt

      - name: Spell check
        uses: crate-ci/typos@master
        with:
          files: ./pr_title.txt